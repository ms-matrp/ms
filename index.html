<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bike Savings Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>MOTO GOAL <span>2027</span></h1>
      <p class="subtitle">Трекер накоплений на KTM / Husqvarna 250</p>
    </header>

    <!-- Выбор цели -->
    <section class="card">
      <h2>1. Выбери цель</h2>
      <div class="goals-grid">
        <button class="goal-btn active" data-target="500000">
          <span class="goal-title">База</span>
          <span class="goal-price">500 000 ₽</span>
        </button>
        <button class="goal-btn" data-target="550000">
          <span class="goal-title">Топ</span>
          <span class="goal-price">550 000 ₽</span>
        </button>
        <button class="goal-btn" data-target="600000">
          <span class="goal-title">Идеал</span>
          <span class="goal-price">600 000 ₽</span>
        </button>
      </div>
    </section>

    <!-- Базовый капитал -->
    <section class="card">
      <h2>2. Твой капитал</h2>
      <div class="input-group">
        <label for="oldBikePrice">Продажа старого байка (₽):</label>
        <input type="number" id="oldBikePrice" value="150000" placeholder="150000">
      </div>
      <div class="input-group">
        <label for="currentBalance">Накопления на руках (₽):</label>
        <input type="number" id="currentBalance" value="107000" placeholder="107000">
      </div>
      <button id="saveCapitalBtn" class="btn btn-secondary">Сохранить капитал</button>
    </section>

    <!-- Добавление дневного дохода -->
    <section class="card">
      <h2>3. Добавить заработок за день</h2>
      <form id="incomeForm">
        <div class="input-row">
          <div class="input-group">
            <label for="incomeDate">Дата:</label>
            <input type="date" id="incomeDate" required>
          </div>
          <div class="input-group">
            <label for="incomeAmount">Сумма (₽):</label>
            <input type="number" id="incomeAmount" placeholder="2000" required>
          </div>
        </div>
        <div class="input-group">
          <label for="incomeSource">Источник (магазин, сайт и т.д.):</label>
          <input type="text" id="incomeSource" placeholder="Смена в магазе / Верстка" required>
        </div>
        <button type="submit" class="btn btn-primary">Добавить в копилку</button>
      </form>
    </section>

    <!-- Главная аналитика -->
    <section class="card highlight-card">
      <h2>Статистика и прогресс</h2>
      
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="progress-text">
        <span id="progressPercent">0%</span> накоплено от цели
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-label">Всего собрано:</span>
          <span class="stat-value" id="totalCapital">0 ₽</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Осталось до цели:</span>
          <span class="stat-value warning" id="remainingAmount">0 ₽</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Заработано за неделю:</span>
          <span class="stat-value" id="weekIncome">0 ₽</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Заработано за месяц:</span>
          <span class="stat-value" id="monthIncome">0 ₽</span>
        </div>
      </div>
    </section>

    <!-- История доходов -->
    <section class="card">
      <div class="section-header">
        <h2>История доходов</h2>
        <button id="clearDataBtn" class="btn-link">Сбросить все данные</button>
      </div>
      <ul id="historyList" class="history-list">
        <!-- Записи добавляются через JS -->
      </ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
